name: Play Store deploy (internal)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: play-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  internal:
    name: Build and upload AAB to internal track
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Preflight — check required secrets are present
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          fail=0
          check() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::secret '$name' is EMPTY or missing (check spelling and that it is a Repository secret)"
              fail=1
            else
              echo "$name: ${#value} chars (ok)"
            fi
          }
          check PLAY_STORE_SERVICE_ACCOUNT_JSON "$SERVICE_ACCOUNT_JSON"
          check PLAY_KEYSTORE_BASE64 "$KEYSTORE_BASE64"
          check PLAY_KEYSTORE_PASSWORD "$STORE_PASSWORD"
          check PLAY_KEY_ALIAS "$KEY_ALIAS"
          check PLAY_KEY_PASSWORD "$KEY_PASSWORD"
          if [ "$fail" -eq 0 ]; then
            echo "$SERVICE_ACCOUNT_JSON" | grep -q '"service_account"' || {
              echo "::error::PLAY_STORE_SERVICE_ACCOUNT_JSON does not contain a service account JSON (expected \"type\": \"service_account\")"
              fail=1
            }
            echo "$KEYSTORE_BASE64" | base64 -d > /dev/null 2>&1 || {
              echo "::error::PLAY_KEYSTORE_BASE64 is not valid base64"
              fail=1
            }
          fi
          exit $fail

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > signing.keystore

      - name: Generate keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Derive version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vX.Y.Z, got $GITHUB_REF_NAME"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          if [ "$CODE" -le 9 ]; then
            echo "::error::derived versionCode $CODE must be greater than 9"
            exit 1
          fi
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Build and upload with fastlane
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android internal

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_NAME }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 10
