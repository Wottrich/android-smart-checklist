[versions]
kotlin = "2.4.20"
ksp = "2.3.11"
gradle = "9.3.0"
coreKtx = "1.18.0"
coroutines = "1.10.2"
appCompat = "1.8.0"
lifecycleRuntime = "2.10.0"
lifecycleViewModelKtx = "2.10.0"
koin = "3.5.0"
composeBom = "2026.04.01"
composeNavigation = "2.8.7"
retrofit = "2.9.0"
loggingInterceptor = "4.9.0"
room = "2.7.1"
androidMaterial = "1.5.0"
androidActivityKtx = "1.13.0"
mockK = "1.12.2"
coreTesting = "2.1.0"
junit = "4.13.2"
junitExt = "1.1.3-beta01"
espressoCore = "3.4.0-beta01"
playServicesAuth = "21.6.0"
androidxCredentials = "1.3.0"
googleid = "1.1.1"
googleApiClientAndroid = "2.8.0"
googleApiServicesDrive = "v3-rev20260916-2.0.0"
kotlinxSerializationJson = "1.7.3"
[libraries]
# Android
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "gradle" }
android-core-ktx = { group="androidx.core", name="core-ktx", version.ref="coreKtx" }
android-app-compat = { group="androidx.appcompat", name="appcompat", version.ref="appCompat" }
android-material = { group="com.google.android.material", name="material", version.ref="androidMaterial" }
android-activity-ktx = { group="androidx.activity",  name="activity-ktx", version.ref="androidActivityKtx"}
android-activity-compose = { group="androidx.activity", name="activity-compose", version.ref="androidActivityKtx" }
# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui-tooling = { group="androidx.compose.ui", name="ui-tooling" }
compose-ui-tooling-preview = { group="androidx.compose.ui", name="ui-tooling-preview" }
compose-material = { group="androidx.compose.material", name="material" }
compose-navigation = { group="androidx.navigation", name="navigation-compose", version.ref="composeNavigation" }
compose-icons = { group="androidx.compose.material", name="material-icons-core" }
gradlePlugins-compose-compiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
# Coroutines
coroutines-core = { group="org.jetbrains.kotlinx", name="kotlinx-coroutines-core", version.ref="coroutines" }
coroutines-play-services = { group="org.jetbrains.kotlinx", name="kotlinx-coroutines-play-services", version.ref="coroutines" }
# Gson
gson = { group="com.squareup.retrofit2", name="converter-gson", version.ref="retrofit" }
# Google Drive backup (issue #94) — the only allowed network feature
play-services-auth = { group="com.google.android.gms", name="play-services-auth", version.ref="playServicesAuth" }
androidx-credentials = { group="androidx.credentials", name="credentials", version.ref="androidxCredentials" }
googleid = { group="com.google.android.libraries.identity.googleid", name="googleid", version.ref="googleid" }
google-api-client-android = { group="com.google.api-client", name="google-api-client-android", version.ref="googleApiClientAndroid" }
google-api-services-drive = { group="com.google.apis", name="google-api-services-drive", version.ref="googleApiServicesDrive" }
kotlinx-serialization-json = { group="org.jetbrains.kotlinx", name="kotlinx-serialization-json", version.ref="kotlinxSerializationJson" }
# Koin
koin-core = { group="io.insert-koin", name="koin-core", version.ref="koin" }
koin-android = { group="io.insert-koin", name="koin-android", version.ref="koin" }
koin-android-compose = { group="io.insert-koin", name="koin-androidx-compose", version.ref="koin" }
# Kotlin
kotlin-stdlib-jdk8 = { group="org.jetbrains.kotlin", name="kotlin-stdlib-jdk8", version.ref="kotlin" }
kotlin-stdlib = { group="org.jetbrains.kotlin", name="kotlin-stdlib", version.ref="kotlin" }
kotlin-gradle-plugin = { group="org.jetbrains.kotlin", name="kotlin-gradle-plugin", version.ref="kotlin" }
# Lifecycle
lifecycle-runtime-ktx = { group="androidx.lifecycle", name="lifecycle-runtime-ktx", version.ref="lifecycleRuntime" }
lifecycle-viewmodel-ktx = { group="androidx.lifecycle", name="lifecycle-viewmodel-ktx", version.ref="lifecycleViewModelKtx" }
# MockK
mockk = { group="io.mockk", name="mockk", version.ref="mockK" }
# Retrofit
retrofit = { group="com.squareup.retrofit2", name="retrofit", version.ref="retrofit" }
retrofit-logging-interceptor = { group="com.squareup.okhttp3", name="logging-interceptor", version.ref="loggingInterceptor" }
# Room
room-runtime = { group="androidx.room", name="room-runtime", version.ref="room" }
room-ktx = { group="androidx.room", name="room-ktx", version.ref="room" }
room-compiler = { group="androidx.room", name="room-compiler", version.ref="room" }
# Test
core-testing = { group="androidx.arch.core", name="core-testing", version.ref="coreTesting" }
coroutines-test = { group="org.jetbrains.kotlinx", name="kotlinx-coroutines-test", version.ref="coroutines" }
junit = { group="junit", name="junit", version.ref="junit" }
junit-ext = { group="androidx.test.ext", name="junit", version.ref="junitExt" }
koin-test = { group="io.insert-koin", name="koin-test", version.ref="koin" }
espresso-core = { group="androidx.test.espresso", name="espresso-core", version.ref="espressoCore" }
[plugins]
android-application = { id="com.android.application", version.ref="gradle" }
android-library = { id="com.android.library", version.ref="gradle" }
jetbrains-kotlin-android = { id="org.jetbrains.kotlin.android", version.ref="kotlin" }
jetbrains-kotlin-jvm = { id="org.jetbrains.kotlin.jvm", version.ref="kotlin" }
jetbrains-kotlin-parcelize = { id="org.jetbrains.kotlin.plugin.parcelize", version.ref="kotlin" }
ksp = { id="com.google.devtools.ksp", version.ref="ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
[bundles]
compose-default = [ "compose-material", "compose-icons" ]
compose-navigation-default = [ "compose-navigation"]
koin-default = [ "koin-core", "koin-android", "koin-android-compose" ]
room-default = [ "room-runtime", "room-ktx" ]
test-default = [ "mockk", "core-testing", "junit", "koin-test", "coroutines-test" ]